<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapa visual del motor</title>
  <desc id="desc">Flujo principal del motor: definicion de partida, sesion, phase model, step model, recipe model, constraint model, action model, resolver model, effect model, victory model y resultado.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#425466" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .node { fill: #ffffff; stroke: #425466; stroke-width: 2; rx: 8; }
      .decision { fill: #fff7ed; stroke: #b45309; stroke-width: 2; }
      .text { fill: #0f172a; font-family: Arial, sans-serif; font-size: 17px; font-weight: 600; }
      .small { fill: #334155; font-family: Arial, sans-serif; font-size: 13px; }
      .line { stroke: #425466; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .consult { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="760" />

  <text class="text" x="40" y="44">Mapa visual del motor</text>
  <text class="small" x="40" y="68">El runtime ejecuta arrays ya definidos. Las recetas se validan antes de convertirse en acciones puras.</text>

  <rect class="node" x="60" y="115" width="170" height="58" />
  <text class="text" x="91" y="150">Definicion</text>

  <rect class="node" x="280" y="115" width="150" height="58" />
  <text class="text" x="323" y="150">Sesion</text>

  <rect class="node" x="480" y="115" width="170" height="58" />
  <text class="text" x="518" y="150">Phase Model</text>

  <rect class="node" x="700" y="115" width="170" height="58" />
  <text class="text" x="744" y="150">Step Model</text>

  <rect class="node" x="920" y="115" width="170" height="58" />
  <text class="text" x="959" y="150">Recipe Model</text>

  <rect class="node" x="920" y="255" width="170" height="58" />
  <text class="text" x="943" y="290">Constraint Model</text>

  <rect class="node" x="700" y="255" width="170" height="58" />
  <text class="text" x="741" y="290">Action Model</text>

  <rect class="node" x="480" y="255" width="170" height="58" />
  <text class="text" x="515" y="290">Resolver Model</text>

  <rect class="node" x="280" y="255" width="170" height="58" />
  <text class="text" x="319" y="290">Effect Model</text>

  <rect class="node" x="60" y="255" width="170" height="58" />
  <text class="text" x="78" y="290">Sesion actualizada</text>

  <rect class="node" x="60" y="410" width="170" height="58" />
  <text class="text" x="101" y="445">Victory Model</text>

  <polygon class="decision" points="365,394 465,439 365,484 265,439" />
  <text class="text" x="313" y="434">Partida</text>
  <text class="text" x="313" y="456">terminada</text>

  <rect class="node" x="560" y="410" width="170" height="58" />
  <text class="text" x="598" y="445">Resultado final</text>

  <path class="line" d="M230 144 H280" />
  <path class="line" d="M430 144 H480" />
  <path class="line" d="M650 144 H700" />
  <path class="line" d="M870 144 H920" />
  <path class="consult" d="M1005 173 V255" />
  <path class="line" d="M920 144 H895 V284 H870" />
  <path class="line" d="M700 284 H650" />
  <path class="line" d="M480 284 H450" />
  <path class="line" d="M280 284 H230" />
  <path class="line" d="M145 313 V410" />
  <path class="line" d="M230 439 H265" />
  <path class="line" d="M465 439 H560" />
  <path class="line" d="M365 394 V72 H565 V115" />

  <text class="small" x="1025" y="218">valida</text>
  <text class="small" x="1025" y="235">constraints</text>
  <text class="small" x="490" y="427">Si</text>
  <text class="small" x="350" y="365">No</text>

  <rect class="node" x="300" y="575" width="580" height="105" />
  <text class="text" x="326" y="608">Lectura corta</text>
  <text class="small" x="326" y="636">fase -> step -> receta -> accion -> efectos propuestos</text>
  <text class="small" x="326" y="660">-> resolver -> aplicar efectos -> victoria</text>
</svg>
