<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa visual del motor</title>
  <desc id="desc">Flujo principal del motor: definiciones y catalogos construyen phase pools; phase, step, recipe, constraint y action ejecutan; resolver, effect y victory cierran el resultado.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #eef2ff; stroke: #475467; stroke-width: 1.5; rx: 10; }
      .node { fill: #ffffff; stroke: #344054; stroke-width: 2; rx: 8; }
      .system { fill: #ecfdf3; stroke: #067647; stroke-width: 2; rx: 8; }
      .decision { fill: #fff7ed; stroke: #b54708; stroke-width: 2; }
      .title { fill: #101828; font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .label { fill: #101828; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .small { fill: #344054; font-family: Arial, sans-serif; font-size: 12px; }
      .line { stroke: #344054; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720" />
  <text class="title" x="40" y="42">Mapa visual del motor</text>
  <text class="small" x="40" y="64">Las definiciones construyen steps. El runtime ejecuta steps ya ordenados.</text>

  <rect class="band" x="35" y="92" width="1090" height="132" />
  <text class="small" x="55" y="118">Definicion y construccion</text>
  <rect class="node" x="60" y="145" width="135" height="48" />
  <text class="label" x="95" y="174">Skin</text>
  <rect class="node" x="235" y="130" width="150" height="48" />
  <text class="label" x="265" y="160">Role Definition</text>
  <rect class="node" x="235" y="180" width="150" height="48" />
  <text class="label" x="258" y="210">Group Definition</text>
  <rect class="node" x="425" y="145" width="150" height="48" />
  <text class="label" x="456" y="174">Step Catalog</text>
  <rect class="node" x="615" y="145" width="150" height="48" />
  <text class="label" x="649" y="174">Step</text>
  <rect class="node" x="805" y="145" width="150" height="48" />
  <text class="label" x="832" y="174">Phase Definition</text>
  <rect class="node" x="995" y="145" width="95" height="48" />
  <text class="label" x="1016" y="174">Pools</text>

  <path class="line" d="M195 169 H235" />
  <path class="line" d="M385 154 H425" />
  <path class="line" d="M385 204 H500 V193" />
  <path class="line" d="M575 169 H615" />
  <path class="line" d="M765 169 H805" />
  <path class="line" d="M955 169 H995" />

  <rect class="band" x="35" y="260" width="1090" height="132" />
  <text class="small" x="55" y="286">Runtime</text>
  <rect class="system" x="60" y="315" width="135" height="48" />
  <text class="label" x="86" y="344">Phase</text>
  <rect class="system" x="235" y="315" width="135" height="48" />
  <text class="label" x="276" y="344">Step</text>
  <rect class="system" x="410" y="315" width="135" height="48" />
  <text class="label" x="449" y="344">Recipe</text>
  <rect class="system" x="585" y="315" width="135" height="48" />
  <text class="label" x="612" y="344">Constraint</text>
  <rect class="system" x="760" y="315" width="135" height="48" />
  <text class="label" x="802" y="344">Action</text>

  <path class="line" d="M1042 193 V248 H127 V315" />
  <path class="line" d="M195 339 H235" />
  <path class="line" d="M370 339 H410" />
  <path class="line" d="M545 339 H585" />
  <path class="line" d="M720 339 H760" />

  <rect class="band" x="35" y="430" width="1090" height="150" />
  <text class="small" x="55" y="456">Efectos y cierre</text>
  <rect class="system" x="185" y="500" width="135" height="48" />
  <text class="label" x="223" y="529">Resolver</text>
  <rect class="system" x="395" y="500" width="135" height="48" />
  <text class="label" x="433" y="529">Effect</text>
  <rect class="system" x="605" y="500" width="135" height="48" />
  <text class="label" x="628" y="529">Victory</text>
  <polygon class="decision" points="855,478 925,524 855,570 785,524" />
  <text class="label" x="826" y="520">Finished</text>
  <rect class="node" x="985" y="500" width="90" height="48" />
  <text class="label" x="1008" y="529">Result</text>

  <path class="line" d="M827 363 V410 H252 V500" />
  <path class="line" d="M320 524 H395" />
  <path class="line" d="M530 524 H605" />
  <path class="line" d="M740 524 H785" />
  <path class="line" d="M925 524 H985" />
  <path class="line" d="M855 478 V408 H127 V363" />

  <text class="small" x="855" y="404">No</text>
  <text class="small" x="940" y="516">Si</text>
</svg>
